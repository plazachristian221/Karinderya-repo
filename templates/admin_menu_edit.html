
{% extends "base.html" %}
{% block title %}{{ page_title }} | Karinderya{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width:700px">
<div class="card-body p-4">
    <h1>{{ page_title }}</h1>

    <form method="POST"
          action="{% if item %}{{ url_for('edit_item', item_id=item.id) }}{% else %}{{ url_for('create_item') }}{% endif %}">
        <div class="mb-3">
            <label class="form-label" for="name">Food Name *</label>
            <input class="form-control" id="name" name="name"
                   value="{{ item.name if item else '' }}"
                   maxlength="150" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" name="description"
                      rows="3">{{ item.description if item else '' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label" for="category">Category *</label>
            <select class="form-select" id="category" name="category" required>
                {% for c in ['Ulam', 'Sabaw', 'Pancit', 'Meryenda', 'Inumin', 'Dessert'] %}
                    <option value="{{ c }}"
                    {% if item and item.category == c %}selected
                    {% elif not item and c == 'Ulam' %}selected{% endif %}>
                        {{ c }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="price">Price (₱) *</label>
            <input class="form-control" type="number" id="price" name="price"
                   value="{{ item.price if item else '' }}"
                   min="0" max="100000" step="0.01" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="image_url">Image URL</label>
            <input class="form-control" type="url" id="image_url"
                   name="image_url"
                   value="{{ item.image_url if item else '' }}"
                   placeholder="https://example.com/food.jpg">
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="available"
                   name="available"
                   {% if not item or item.available %}checked{% endif %}>
            <label class="form-check-label" for="available">
                Available for ordering
            </label>
        </div>

        <button class="btn btn-brand" type="submit">Save Item</button>
        <a class="btn btn-secondary" href="{{ url_for('admin_items') }}">Cancel</a>
    </form>
</div>
</div>
{% endblock %}
