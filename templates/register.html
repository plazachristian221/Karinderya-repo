{% extends "base.html" %}
{% block title %}Register | Karinderya{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 520px;">
    <div class="card-body p-4">
        <h2>Create an Account</h2>
        <p>Register to order your favorite meals.</p>
        
        <!-- ERROR MESSAGE DISPLAY ADDED HERE -->
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <!-- Changed name="name" to name="username" -->
                <input class="form-control" id="username" name="username"
                       minlength="3" maxlength="120" required autocomplete="username">
            </div>
            
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password"
                       name="password" minlength="6" required
                       autocomplete="new-password">
                <small class="text-muted">At least 6 characters.</small>
            </div>
            
            <div class="mb-3">
                <label class="form-label" for="confirm_password">
                    Confirm Password
                </label>
                <input class="form-control" type="password"
                       id="confirm_password" name="confirm_password"
                       minlength="6" required autocomplete="new-password">
            </div>
            
            <button class="btn btn-danger w-100" type="submit">
                Register
            </button>
        </form>
        
        <p class="mt-3 mb-0">
            Already registered? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
