{% extends "base.html" %}
{% block title %}Checkout{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-5">
                <h3 class="mb-4 text-center">Confirm Your Order</h3>
                
                <div class="mb-4 text-center bg-light p-3 rounded">
                    <p class="mb-1 text-muted">Restaurant</p>
                    <h5 class="text-danger">{{ restaurant.name }}</h5>
                    <hr>
                    <p class="mb-1 text-muted">Item</p>
                    <h5>{{ food }}</h5>
                    <hr>
                    <p class="mb-1 text-muted">Total Price</p>
                    <h4 class="text-success fw-bold">₱{{ price }}</h4>
                </div>

                <form method="POST" action="{{ url_for('order') }}">
                    <input type="hidden" name="restaurant_id" value="{{ restaurant_id }}">
                    <input type="hidden" name="food" value="{{ food }}">
                    <input type="hidden" name="price" value="{{ price }}">
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Payment Method</label>
                        <select name="payment_method" class="form-select" required>
                            <option value="Cash on Pickup">Cash on Pickup</option>
                            <option value="Gcash">GCash / Online</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-danger w-100 btn-lg mb-2">Place Order</button>
                    <a href="{{ url_for('restaurant', restaurant_id=restaurant_id) }}" class="btn btn-light w-100">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
