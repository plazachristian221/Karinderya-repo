{% extends "base.html" %}
{% block content %}
<div class="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Confirm Your Order</h2>
    
    <div class="bg-orange-50 p-4 rounded-lg mb-6 border border-orange-100">
        <p class="text-sm text-gray-500 mb-1">Ordering from</p>
        <p class="font-bold text-gray-800 mb-3">{{ restaurant.name }}</p>
        
        <div class="flex justify-between items-center border-t border-orange-200 pt-3">
            <span class="font-bold text-lg text-gray-800">{{ food }}</span>
            <span class="font-bold text-xl text-brand">₱{{ price }}</span>
        </div>
    </div>

    <form method="POST" action="{{ url_for('order') }}">
        <input type="hidden" name="restaurant_id" value="{{ restaurant_id }}">
        <input type="hidden" name="food" value="{{ food }}">
        <input type="hidden" name="price" value="{{ price }}">

        <label class="block text-gray-700 font-medium mb-2">Payment Method</label>
        <select name="payment_method" class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-brand focus:border-brand outline-none bg-white mb-6" required>
            <option value="Cash on Pickup">Cash on Pickup</option>
            <option value="GCash">GCash</option>
        </select>

        <button type="submit" class="w-full bg-brand text-white font-bold py-3 rounded-lg shadow hover:bg-orange-700 transition text-lg">
            Place Order
        </button>
        <div class="text-center mt-4">
            <a href="{{ url_for('restaurant', restaurant_id=restaurant_id) }}" class="text-gray-500 hover:text-brand text-sm">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
