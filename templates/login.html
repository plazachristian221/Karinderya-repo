{% extends "base.html" %}
{% block title %}Login | Karinderya{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 480px;">
    <div class="card-body p-4">
        <h2>Welcome Back!</h2>
        <p>Log in to continue to Karinderya.</p>
        
        <!-- ERROR MESSAGE DISPLAY ADDED HERE -->
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <!-- Changed from Email to Username -->
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username"
                       name="username" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password"
                       name="password" required autocomplete="current-password">
            </div>
            <!-- Changed btn-brand to btn-danger to match standard Bootstrap -->
            <button class="btn btn-danger w-100" type="submit">Login</button>
        </form>
        
        <p class="mt-3 mb-0">
            No account yet? <a href="{{ url_for('register') }}">Register</a>
        </p>
    </div>
</div>
{% endblock %}
